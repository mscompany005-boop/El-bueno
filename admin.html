<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SkyDove 3D LAB — Admin · Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#02020a;--deep:#06060f;--card:#0f0f1e;--border:#ffffff0a;--border2:#ffffff18;
  --cyan:#00f5c4;--blue:#2979ff;--text:#f0f0fa;--text2:#a0a0c0;--text3:#5a5a80;
  --warn:#ffb800;--danger:#ff3d5e;--success:#00e676;
  --font-d:'Orbitron',sans-serif;--font-b:'Space Grotesk',sans-serif;--font-m:'JetBrains Mono',monospace;
}
body{background:var(--void);color:var(--text);font-family:var(--font-b);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% 0%,#2979ff12,transparent);pointer-events:none;z-index:0;}

/* HEADER */
.header{background:#06060f;border-bottom:1px solid var(--border2);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.header img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);}
.header-title{font-family:var(--font-d);font-size:13px;font-weight:700;color:var(--text);letter-spacing:.08em;}
.header-sub{font-family:var(--font-m);font-size:9px;color:var(--text3);letter-spacing:.12em;margin-top:2px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.online-badge{display:flex;align-items:center;gap:6px;background:#00e67618;border:1px solid #00e67630;border-radius:50px;padding:4px 12px;font-size:11px;color:var(--success);font-family:var(--font-m);}
.online-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);animation:pulse 2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 16px 0;max-width:1000px;margin:0 auto;position:relative;z-index:1;}
.stat-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:14px 16px;text-align:center;}
.stat-num{font-family:var(--font-d);font-size:22px;font-weight:700;margin-bottom:4px;}
.stat-num.cyan{color:var(--cyan);}
.stat-num.blue{color:#60a5fa;}
.stat-num.warn{color:var(--warn);}
.stat-num.green{color:var(--success);}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;}

/* MAIN */
.main{max-width:1000px;margin:0 auto;padding:16px 16px 60px;position:relative;z-index:1;}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-wrap{flex:1;min-width:200px;position:relative;}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:10px 14px 10px 36px;color:var(--text);font-family:var(--font-b);font-size:13px;outline:none;transition:.2s;}
.search-wrap input:focus{border-color:var(--cyan);}
.search-wrap::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;}
.filter-btn{padding:10px 14px;background:var(--card);border:1px solid var(--border2);border-radius:10px;color:var(--text2);font-family:var(--font-b);font-size:12px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap;}
.filter-btn:hover,.filter-btn.active{border-color:var(--cyan);color:var(--cyan);}
.refresh-btn{padding:10px 16px;background:linear-gradient(135deg,var(--cyan),var(--blue));border:none;border-radius:10px;color:#000;font-family:var(--font-b);font-size:12px;font-weight:700;cursor:pointer;transition:.2s;}
.refresh-btn:hover{filter:brightness(1.1);}

/* PEDIDOS TABLE */
.table-wrap{background:var(--card);border:1px solid var(--border2);border-radius:16px;overflow:hidden;}
.table-header{display:grid;grid-template-columns:110px 1fr 90px 100px 80px 100px;gap:0;background:#0c0c1a;padding:10px 16px;font-family:var(--font-m);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border2);}
.pedido-row{display:grid;grid-template-columns:110px 1fr 90px 100px 80px 100px;gap:0;padding:14px 16px;border-bottom:1px solid var(--border);align-items:center;transition:.2s;cursor:pointer;}
.pedido-row:last-child{border-bottom:none;}
.pedido-row:hover{background:#ffffff04;}
.folio-badge{font-family:var(--font-m);font-size:11px;color:var(--cyan);font-weight:600;}
.client-name{font-size:14px;font-weight:700;color:var(--text);}
.client-contact{font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--font-m);}
.mat-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;background:#2979ff18;color:#60a5fa;font-family:var(--font-m);}
.total-val{font-family:var(--font-m);font-size:13px;font-weight:700;color:var(--cyan);}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:50px;font-size:10px;font-weight:700;white-space:nowrap;}
.sp-pending{background:#ffb80018;color:var(--warn);border:1px solid #ffb80030;}
.sp-done{background:#00e67618;color:var(--success);border:1px solid #00e67630;}
.sp-rejected{background:#ff3d5e18;color:var(--danger);border:1px solid #ff3d5e30;}

/* ACTIONS */
.actions{display:flex;gap:6px;flex-wrap:wrap;}
.act-btn{padding:5px 10px;border-radius:7px;border:1px solid var(--border2);background:none;color:var(--text2);font-size:11px;font-family:var(--font-b);font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap;}
.act-btn:hover{background:var(--border2);color:var(--text);}
.act-btn.dl{border-color:#2979ff40;color:#60a5fa;}
.act-btn.dl:hover{background:#2979ff18;}
.act-btn.done{border-color:#00e67640;color:var(--success);}
.act-btn.done:hover{background:#00e67618;}
.act-btn.reject{border-color:#ff3d5e40;color:var(--danger);}
.act-btn.reject:hover{background:#ff3d5e18;}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-icon{font-size:48px;margin-bottom:12px;display:block;}
.empty-title{font-family:var(--font-d);font-size:16px;color:var(--text2);margin-bottom:6px;}
.empty-sub{font-size:13px;line-height:1.6;}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:#00000090;z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-ov.on{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text2);cursor:pointer;padding:4px 10px;font-family:var(--font-b);font-size:13px;}
.modal-title{font-family:var(--font-d);font-size:16px;font-weight:700;margin-bottom:16px;color:var(--cyan);}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.detail-row:last-child{border:none;}
.detail-lbl{color:var(--text3);}
.detail-val{font-weight:600;color:var(--text);font-family:var(--font-m);font-size:12px;}
.stl-file-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0d0d18;border-radius:10px;border:1px solid var(--border2);margin-bottom:8px;}
.stl-file-name{font-family:var(--font-m);font-size:12px;color:var(--cyan);flex:1;}
.stl-dl-btn{padding:6px 12px;background:linear-gradient(135deg,var(--blue),var(--blue));border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-b);}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--text3);font-family:var(--font-m);font-size:12px;}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* STATUS SELECT */
select.status-sel{background:var(--deep);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--font-b);font-size:11px;padding:4px 8px;outline:none;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card);border:1px solid var(--border2);border-radius:50px;padding:10px 20px;font-size:12px;z-index:600;transition:.3s;opacity:0;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}

@media(max-width:700px){
  .table-header,.pedido-row{grid-template-columns:90px 1fr 80px 80px;}
  .table-header .h-mat,.pedido-row .c-mat,.table-header .h-acc{display:none;}
}
</style>
</head>

      <div class="h-acc">Acciones</div>
    </div>
    <div id="pedidos-list">
      <div class="loading"><div class="spin"></div> Cargando pedidos…</div>
    </div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-ov" id="modal-ov" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="$('modal-ov').classList.remove('on')">✕ Cerrar</button>
    <div class="modal-title" id="modal-title">Detalle del pedido</div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://sdqwlahtnkypehpmoqaa.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcXdsYWh0bmt5cGVocG1vcWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMjQ3MDcsImV4cCI6MjA5MjgwMDcwN30.qI6vj1ZM8qXt2Dq9mu8m0GK_BWUWs3Zr0E_0Spgedkc';
const $=id=>document.getElementById(id);
const fm=v=>'$'+Number(v).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});

let allPedidos=[];let filterMode='all';

async function sbFetch(path,method='GET',body){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{
    method,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:body?JSON.stringify(body):undefined
  });
  if(!r.ok){const t=await r.text();throw new Error(t);}
  return r.json().catch(()=>({}));
}

async function loadPedidos(){
  $('pedidos-list').innerHTML='<div class="loading"><div class="spin"></div> Cargando pedidos…</div>';
  try{
    const data=await sbFetch('pedidos_cotizador?select=*&order=created_at.desc');
    allPedidos=Array.isArray(data)?data:[];
    $('conn-badge').textContent='✅ Conectado';
    $('conn-badge').style.color='var(--success)';
    updateStats();renderPedidos();
  }catch(e){
    $('conn-badge').textContent='⚠️ Sin conexión';
    $('conn-badge').style.color='var(--warn)';
    $('pedidos-list').innerHTML=`<div class="empty"><span class="empty-icon">📡</span><div class="empty-title">Sin conexión</div><div class="empty-sub">Verifica la configuración de Supabase.<br>${e.message}</div></div>`;
  }
}

function updateStats(){
  const pend=allPedidos.filter(p=>p.status==='pending').length;
  const done=allPedidos.filter(p=>p.status==='done').length;
  const monto=allPedidos.reduce((s,p)=>s+(p.total||0),0);
  $('st-total').textContent=allPedidos.length;
  $('st-pend').textContent=pend;
  $('st-done').textContent=done;
  $('st-monto').textContent='$'+Number(monto).toLocaleString('es-MX',{maximumFractionDigits:0});
}

function setFilter(btn,mode){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');filterMode=mode;renderPedidos();
}

function filterPedidos(){renderPedidos();}

function renderPedidos(){
  const q=($('search').value||'').toLowerCase();
  let list=allPedidos.filter(p=>{
    if(filterMode==='pending'&&p.status!=='pending')return false;
    if(filterMode==='done'&&p.status!=='done')return false;
    return !q||(p.folio||'').toLowerCase().includes(q)||(p.nombre||'').toLowerCase().includes(q)||(p.material||'').toLowerCase().includes(q)||(p.wa||'').includes(q);
  });
  if(list.length===0){
    $('pedidos-list').innerHTML=`<div class="empty"><span class="empty-icon">📂</span><div class="empty-title">${allPedidos.length===0?'Sin pedidos aún':'Sin resultados'}</div><div class="empty-sub">${allPedidos.length===0?'Cuando un cliente cotice, aparecerá aquí automáticamente.':'Intenta con otro término de búsqueda.'}</div></div>`;
    return;
  }
  const spMap={pending:'<span class="status-pill sp-pending">⏳ Pendiente</span>',done:'<span class="status-pill sp-done">✅ Completado</span>',rejected:'<span class="status-pill sp-rejected">❌ Rechazado</span>'};
  $('pedidos-list').innerHTML=list.map(p=>{
    const sp=spMap[p.status]||spMap.pending;
    const dateStr=p.created_at?new Date(p.created_at).toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
    const hasFiles=p.stl_files&&p.stl_files.length>0;
    return `<div class="pedido-row" onclick="openDetail('${p.id}')">
      <div><div class="folio-badge">${p.folio||'—'}</div><div style="font-size:9px;color:var(--text3);margin-top:3px;font-family:var(--font-m)">${dateStr}</div></div>
      <div><div class="client-name">${p.nombre||'—'}</div><div class="client-contact">${p.wa||p.email||''}</div></div>
      <div class="c-mat"><span class="mat-badge">${p.material||'—'}</span></div>
      <div class="total-val">${fm(p.total||0)}</div>
      <div>${sp}</div>
      <div class="actions" onclick="event.stopPropagation()">
        <button class="act-btn done" onclick="updateStatus('${p.id}','done')">✓</button>
        <button class="act-btn reject" onclick="updateStatus('${p.id}','rejected')">✕</button>
        ${hasFiles?`<button class="act-btn dl" onclick="openDetail('${p.id}')">⬇ STL</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function openDetail(id){
  const p=allPedidos.find(x=>x.id===id);if(!p)return;
  $('modal-title').textContent=p.folio||'Pedido';
  const piezas=p.piezas||[];
  const charges=p.extras||[];
  let stlHtml='';
  if(p.stl_files&&p.stl_files.length>0){
    stlHtml=`<div style="margin:12px 0"><div style="font-family:var(--font-m);font-size:10px;color:var(--text3);letter-spacing:.1em;margin-bottom:8px;">ARCHIVOS STL</div>`;
    p.stl_files.forEach(f=>{
      stlHtml+=`<div class="stl-file-item"><span style="font-size:16px">📦</span><span class="stl-file-name">${f.name}</span><button class="stl-dl-btn" onclick="downloadSTL('${id}','${f.name}')">⬇ Descargar</button></div>`;
    });
    stlHtml+='</div>';
  }
  $('modal-body').innerHTML=`
    ${stlHtml}
    <div class="detail-row"><span class="detail-lbl">Folio</span><span class="detail-val">${p.folio||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Fecha</span><span class="detail-val">${p.created_at?new Date(p.created_at).toLocaleString('es-MX'):''}</span></div>
    <div class="detail-row"><span class="detail-lbl">Cliente</span><span class="detail-val">${p.nombre||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">WhatsApp</span><span class="detail-val">${p.wa||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Email</span><span class="detail-val">${p.email||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Proyecto</span><span class="detail-val">${p.proyecto||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Material</span><span class="detail-val">${p.material||'—'} / ${p.color||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Tipo</span><span class="detail-val">${p.tipo||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Piezas</span><span class="detail-val">${piezas.map(pz=>`${pz.nombre||'Pieza'} ×${pz.qty||1} (${(pz.gramos||0).toFixed(1)}g)`).join(', ')||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Extras</span><span class="detail-val">${charges.join(', ')||'Ninguno'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Envío</span><span class="detail-val">${p.envio_label||'—'}</span></div>
    <div class="detail-row"><span class="detail-lbl">Total estimado</span><span class="detail-val" style="color:var(--cyan);font-size:14px">${fm(p.total||0)}</span></div>
    <div style="margin-top:14px">
      <div style="font-family:var(--font-m);font-size:10px;color:var(--text3);letter-spacing:.1em;margin-bottom:8px;">CAMBIAR ESTADO</div>
      <div style="display:flex;gap:8px">
        <button class="act-btn" onclick="updateStatus('${id}','pending');$('modal-ov').classList.remove('on')">⏳ Pendiente</button>
        <button class="act-btn done" onclick="updateStatus('${id}','done');$('modal-ov').classList.remove('on')">✅ Completado</button>
        <button class="act-btn reject" onclick="updateStatus('${id}','rejected');$('modal-ov').classList.remove('on')">❌ Rechazar</button>
      </div>
    </div>`;
  $('modal-ov').classList.add('on');
}

function closeModal(e){if(e.target===$('modal-ov'))$('modal-ov').classList.remove('on');}

async function updateStatus(id,status){
  try{
    await fetch(SB_URL+'/rest/v1/pedidos_cotizador?id=eq.'+id,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({status,updated_at:new Date().toISOString()})});
    const p=allPedidos.find(x=>x.id===id);if(p)p.status=status;
    updateStats();renderPedidos();
    showToast('✅ Estado actualizado');
  }catch(e){showToast('❌ Error: '+e.message);}
}

function downloadSTL(pedidoId, fileName){
  const p=allPedidos.find(x=>x.id===pedidoId);if(!p)return;
  const f=p.stl_files?.find(x=>x.name===fileName);
  if(!f){showToast('⚠️ Archivo no encontrado');return;}
  // New format: base64 data
  if(f.data){
    try{
      const binary=atob(f.data);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      const blob=new Blob([bytes],{type:'application/octet-stream'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      showToast('✅ Descargando '+fileName);
    }catch(e){showToast('❌ Error al descargar');}
  // Old format: storage path - open in new tab
  } else if(f.path){
    const url=SB_URL+'/storage/v1/object/public/stl-files/'+f.path;
    window.open(url,'_blank');
    showToast('Abriendo archivo...');
  } else {
    showToast('⚠️ Archivo sin datos — pedido enviado antes de la actualización');
  }
}

function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000);}

// Init
loadPedidos();
// Auto-refresh every 60s
setInterval(loadPedidos, 60000);
</script>
</body>
</html>
